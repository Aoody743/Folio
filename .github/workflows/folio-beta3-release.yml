name: Publish Folio 1.0-beta3 prerelease

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-1.0-beta3-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Aoody743/Folio'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      POWERLINUX_BUILD_CACHE: ${{ runner.temp }}/folio-beta3-build-cache
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify source, UI and installer
        run: |
          # Acceptance harness corrections may advance without changing the
          # frozen product. Reject any non-test product-source differences.
          changed=$(git diff --name-only 1.0-beta3 "$GITHUB_SHA" -- cmd internal frontend go.mod go.sum third_party scripts)
          unexpected=$(printf '%s\n' "$changed" | sed '/^$/d; /_test\.go$/d')
          [[ -z "$unexpected" ]] || { printf '%s\n' "$unexpected"; exit 1; }
          make rewrite-deps REWRITE_CACHE="$POWERLINUX_BUILD_CACHE"
          umask 077
          make rewrite-test REWRITE_CACHE="$POWERLINUX_BUILD_CACHE"

      - name: Restore the immutable product tag for packaging
        uses: actions/checkout@v4
        with:
          ref: 1.0-beta3

      - name: Build and verify the tagged beta3 package
        run: |
          set -Eeuo pipefail
          release_commit=$(git rev-parse '1.0-beta3^{commit}')
          [[ "$(git rev-parse HEAD)" == "$release_commit" ]]
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]]
          bash scripts/rewrite/build.sh \
            --version 1.0-beta3 \
            --architectures amd64 \
            --output "$GITHUB_WORKSPACE/release-assets"
          archive=release-assets/folio-1.0-beta3-linux-amd64.tar.gz
          grep -Fx "commit=$release_commit" <(tar -xOzf "$archive" BUILDINFO)
          grep -Fx 'working_tree_dirty=false' <(tar -xOzf "$archive" BUILDINFO)
          python3 scripts/rewrite/test-package.py "$archive"
          printf '%s  %s\n' \
            370239be119764e86066fdd537ce9255c63d515f07617f2ddd5a0406086c08e1 \
            "$archive" | sha256sum --check

      - name: Read the recorded acceptance for the frozen package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-metadata


      - name: Prepare installer and checksums
        run: |
          set -Eeuo pipefail
          install -m 0755 scripts/rewrite/install-1.0-beta3.sh release-assets/install-1.0-beta3.sh
          cp release-metadata/docs/rewrite/evidence/beta3-20261022/ACCEPTANCE.json release-assets/
          cp release-metadata/docs/rewrite/evidence/beta3-20261022/verification-logs.tar.gz release-assets/
          cd release-assets
          jq -e '.version == "1.0-beta3" and .artifact_sha256 == "370239be119764e86066fdd537ce9255c63d515f07617f2ddd5a0406086c08e1"' ACCEPTANCE.json
          cp CHECKSUMS.txt SHA256SUMS.txt
          sha256sum ACCEPTANCE.json verification-logs.tar.gz >> SHA256SUMS.txt
          sha256sum install-1.0-beta3.sh >> SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          bash -n install-1.0-beta3.sh

      - name: Publish the verified prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view 1.0-beta3 >/dev/null 2>&1; then
            [[ "$(gh release view 1.0-beta3 --json isDraft --jq .isDraft)" == true ]] || {
              echo 'Refusing to replace published beta3 assets' >&2; exit 1;
            }
            gh release upload 1.0-beta3 \
              release-assets/folio-1.0-beta3-linux-amd64.tar.gz \
              release-assets/install-1.0-beta3.sh \
              release-assets/SHA256SUMS.txt \
              release-assets/ACCEPTANCE.json \
              release-assets/verification-logs.tar.gz \
              --clobber
            gh release edit 1.0-beta3 --title 'Folio 1.0-beta3' \
              --notes-file .github/release-notes/1.0-beta3.md --prerelease --draft=false
          else
            gh release create 1.0-beta3 \
              release-assets/folio-1.0-beta3-linux-amd64.tar.gz \
              release-assets/install-1.0-beta3.sh \
              release-assets/SHA256SUMS.txt \
              release-assets/ACCEPTANCE.json \
              release-assets/verification-logs.tar.gz \
              --verify-tag --title 'Folio 1.0-beta3' \
              --notes-file .github/release-notes/1.0-beta3.md --prerelease
          fi
